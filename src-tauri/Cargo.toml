[package]
name = "ai_workbench"
version = "0.2.38"
description = "AI Workbench - AI-powered developer toolbox"
authors = ["you"]
edition = "2021"
default-run = "ai_workbench"

[lib]
name = "ai_workbench"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
rfd = "0.15"
rusqlite = { version = "0.33", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
# 文档 / 表格：docx 与 xlsx 都是 zip 容器，xlsx 用 calamine 读单元格。
# zip 必须钉在 2.2：calamine 0.26 依赖 `zip = "2"`，但 2.6 把 `ZipFile` 加了泛型参数，
# 会让 calamine 编译失败（zip 2.2 是它发布时的版本）。
zip = "=2.2.0"
calamine = "0.26"
# PDF 文本层（扫描件不做 OCR）；与 zip 2.2 无冲突。
lopdf = "0.34"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
base64 = "0.22"
url = "2"
arboard = "3"
rand = "0.9"
encoding_rs = "0.8"
sha2 = "0.10"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pem", "std", "pkcs8"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Registry",
  "Win32_System_Environment",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_System_Diagnostics_Debug",
  "Win32_Security_Cryptography",
  "ApplicationModel",
  "Foundation_Collections",
  "Management_Deployment",
] }
flate2 = "1"
crc32fast = "1"
# AI hub agent: diffs on the approval card, regex grep, screenshot encoding
similar = "2"
regex = "1"
png = "0.17"
# Agent file walk: honour .gitignore / global excludes, and gitignore-style globs
ignore = "0.4"

[features]
# Diagnostic binaries under `src/bin/` are opt-in: without this feature they are not
# part of `cargo build --bins`, so the bundler no longer ships them inside the
# installer (they used to land next to the app as cursor_switch_test.exe).
# Build them with `cargo build --features dev-tools`.
dev-tools = []

[[bin]]
name = "cursor_switch_test"
path = "src/bin/cursor_switch_test.rs"
required-features = ["dev-tools"]

[[bin]]
name = "dump_composer"
path = "src/bin/dump_composer.rs"
required-features = ["dev-tools"]
