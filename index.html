<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Workbench</title>
    <script>
      (function () {
        if (location.hash.indexOf("#/quick-ask-bubble") === 0) {
          document.documentElement.classList.add("qa-bubble-mode");
        }
      })();
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #0e1014;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      /* Floating bubble: kill opaque window fill before React paints */
      html.qa-bubble-mode,
      html.qa-bubble-mode body,
      html.qa-bubble-mode #root {
        background: transparent !important;
        background-image: none !important;
      }
      html.qa-bubble-mode body::before,
      html.qa-bubble-mode body::after,
      html.qa-bubble-mode #root:empty::before,
      html.qa-bubble-mode #root:empty::after {
        display: none !important;
        content: none !important;
        animation: none !important;
      }
      /* Main app loading only — never show spinner chrome in bubble window */
      html:not(.qa-bubble-mode) #root:empty {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 20px;
      }
      html:not(.qa-bubble-mode) #root:empty::before {
        content: "";
        width: 64px;
        height: 64px;
        background: url("/favicon.png") center / contain no-repeat;
      }
      html:not(.qa-bubble-mode) #root:empty::after {
        content: "";
        width: 36px;
        height: 36px;
        border: 3px solid rgba(184, 192, 204, 0.2);
        border-top-color: #B8C0CC;
        border-radius: 50%;
        animation: app-spin 0.8s linear infinite;
      }
      @keyframes app-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
