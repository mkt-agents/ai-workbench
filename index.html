<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Workbench</title>
    <script>
      (function () {
        var h = location.hash || "";
        if (h.indexOf("#/ai-hub") === 0) {
          document.documentElement.classList.add("boot-splash-skip");
        }
        if (h.indexOf("#/ai-hub-bubble") === 0) {
          document.documentElement.classList.add("qa-bubble-mode");
        }
      })();
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #0c0c0b;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      /* Floating bubble: kill opaque window fill before React paints */
      html.qa-bubble-mode,
      html.qa-bubble-mode body,
      html.qa-bubble-mode #root {
        background: transparent !important;
        background-image: none !important;
      }
      html.qa-bubble-mode body::before,
      html.qa-bubble-mode body::after,
      html.qa-bubble-mode #boot-splash,
      html.boot-splash-skip #boot-splash {
        display: none !important;
        content: none !important;
        animation: none !important;
      }

      /* ── Boot splash (main window only, paints before the JS bundle) ── */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background:
          radial-gradient(ellipse 70% 48% at 50% 42%, rgba(232, 217, 200, 0.09) 0%, transparent 58%),
          radial-gradient(ellipse 42% 32% at 18% 12%, rgba(184, 192, 204, 0.08) 0%, transparent 55%),
          radial-gradient(ellipse 36% 28% at 88% 88%, rgba(205, 187, 168, 0.07) 0%, transparent 52%),
          linear-gradient(180deg, #121110 0%, #0c0c0b 48%, #090908 100%);
        color: #f6f4f1;
        pointer-events: none;
        opacity: 1;
        transition: opacity 420ms cubic-bezier(0.22, 1, 0.36, 1),
          transform 420ms cubic-bezier(0.22, 1, 0.36, 1),
          filter 420ms ease;
      }
      #boot-splash.is-leaving {
        opacity: 0;
        transform: scale(1.03);
        filter: blur(6px);
      }
      #boot-splash.is-gone {
        display: none;
      }

      .boot-splash-stage {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 30px;
        animation: boot-enter 560ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .boot-splash-hero {
        position: relative;
        width: 188px;
        height: 188px;
        display: grid;
        place-items: center;
      }

      .boot-splash-bloom {
        position: absolute;
        inset: -8%;
        border-radius: 50%;
        background: radial-gradient(
          circle at 50% 45%,
          rgba(232, 217, 200, 0.48) 0%,
          rgba(232, 217, 200, 0.16) 34%,
          transparent 70%
        );
        filter: blur(8px);
        animation: boot-bloom 2.4s ease-in-out infinite;
      }

      .boot-splash-rays {
        position: absolute;
        inset: 6%;
        border-radius: 50%;
        background: conic-gradient(
          from 0deg,
          transparent 0deg,
          rgba(232, 217, 200, 0.07) 12deg,
          transparent 28deg,
          transparent 90deg,
          rgba(184, 192, 204, 0.06) 104deg,
          transparent 124deg,
          transparent 180deg,
          rgba(232, 217, 200, 0.08) 196deg,
          transparent 214deg,
          transparent 270deg,
          rgba(184, 192, 204, 0.05) 286deg,
          transparent 308deg
        );
        mask: radial-gradient(farthest-side, #000 28%, transparent 72%);
        -webkit-mask: radial-gradient(farthest-side, #000 28%, transparent 72%);
        animation: boot-sheen 14s linear infinite;
        opacity: 0.9;
      }

      .boot-splash-sheen {
        position: absolute;
        inset: 12%;
        border-radius: 50%;
        background: conic-gradient(
          from 210deg,
          transparent 0deg,
          rgba(232, 217, 200, 0.28) 40deg,
          transparent 96deg,
          transparent 190deg,
          rgba(184, 192, 204, 0.18) 236deg,
          transparent 300deg
        );
        mask: radial-gradient(farthest-side, transparent calc(100% - 16px), #000 calc(100% - 15px));
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 16px), #000 calc(100% - 15px));
        animation: boot-sheen 4.2s linear infinite;
        opacity: 0.95;
      }

      .boot-splash-sparks {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .boot-splash-sparks i {
        position: absolute;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #E8D9C8;
        box-shadow: 0 0 8px rgba(232, 217, 200, 0.85);
        opacity: 0;
        animation: boot-spark 2.8s ease-in-out infinite;
      }
      .boot-splash-sparks i:nth-child(1) { left: 18%; top: 28%; animation-delay: 0.1s; }
      .boot-splash-sparks i:nth-child(2) { left: 78%; top: 22%; width: 2px; height: 2px; animation-delay: 0.55s; }
      .boot-splash-sparks i:nth-child(3) { left: 86%; top: 58%; animation-delay: 1.05s; }
      .boot-splash-sparks i:nth-child(4) { left: 14%; top: 66%; width: 2px; height: 2px; animation-delay: 1.45s; }
      .boot-splash-sparks i:nth-child(5) { left: 48%; top: 8%; animation-delay: 0.8s; }
      .boot-splash-sparks i:nth-child(6) { left: 52%; top: 90%; width: 2px; height: 2px; animation-delay: 1.9s; }

      .boot-splash-orbit {
        position: relative;
        z-index: 1;
        width: 138px;
        height: 138px;
        display: grid;
        place-items: center;
      }

      .boot-splash-halo {
        position: absolute;
        inset: -14px;
        border-radius: 50%;
        border: 1px dashed rgba(232, 217, 200, 0.22);
        animation: boot-spin 12s linear infinite;
      }

      .boot-splash-track {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1px solid rgba(232, 217, 200, 0.22);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.08),
          0 0 24px rgba(232, 217, 200, 0.08);
      }

      .boot-splash-arc {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2.5px solid transparent;
        border-top-color: #E8D9C8;
        border-right-color: rgba(232, 217, 200, 0.55);
        filter: drop-shadow(0 0 6px rgba(232, 217, 200, 0.45));
        animation: boot-spin 1.25s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }
      .boot-splash-arc.is-secondary {
        inset: 10px;
        border-width: 1.5px;
        border-top-color: rgba(184, 192, 204, 0.85);
        border-right-color: transparent;
        border-bottom-color: rgba(184, 192, 204, 0.35);
        filter: drop-shadow(0 0 4px rgba(184, 192, 204, 0.35));
        animation-duration: 2s;
        animation-direction: reverse;
        opacity: 0.95;
      }

      .boot-splash-mark-wrap {
        position: relative;
        z-index: 1;
        width: 80px;
        height: 80px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        background:
          linear-gradient(160deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.02)),
          rgba(28, 25, 22, 0.82);
        border: 1px solid rgba(232, 217, 200, 0.34);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.14),
          0 0 0 1px rgba(0, 0, 0, 0.3),
          0 12px 32px rgba(0, 0, 0, 0.42),
          0 0 36px rgba(232, 217, 200, 0.18);
        animation: boot-breathe 2.4s ease-in-out infinite;
        overflow: hidden;
      }
      .boot-splash-mark-wrap::after {
        content: "";
        position: absolute;
        inset: -40% -60%;
        background: linear-gradient(
          115deg,
          transparent 34%,
          rgba(255, 255, 255, 0.28) 48%,
          transparent 62%
        );
        animation: boot-glint 2.4s ease-in-out infinite;
        pointer-events: none;
      }
      .boot-splash-mark {
        width: 60px;
        height: 60px;
        object-fit: contain;
        border-radius: 12px;
        display: block;
        position: relative;
        z-index: 1;
      }

      .boot-splash-copy {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        min-width: 200px;
      }
      .boot-splash-title {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-indent: 0.16em;
        text-transform: uppercase;
        color: rgba(246, 244, 241, 0.92);
        background: linear-gradient(
          90deg,
          rgba(246, 244, 241, 0.42) 0%,
          #E8D9C8 38%,
          #ffffff 52%,
          #E8D9C8 66%,
          rgba(246, 244, 241, 0.42) 100%
        );
        background-size: 240% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: boot-title-shimmer 2.2s ease-in-out infinite;
      }
      .boot-splash-bar {
        width: 168px;
        height: 3px;
        border-radius: 9999px;
        background: rgba(232, 217, 200, 0.16);
        box-shadow: inset 0 0 0 1px rgba(232, 217, 200, 0.08);
        overflow: hidden;
      }
      .boot-splash-bar > span {
        display: block;
        width: 46%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(
          90deg,
          transparent,
          #E8D9C8,
          #fff6ea,
          rgba(184, 192, 204, 0.85)
        );
        box-shadow: 0 0 10px rgba(232, 217, 200, 0.55);
        animation: boot-bar 1.45s ease-in-out infinite;
      }
      .boot-splash-hint {
        font-size: 11px;
        letter-spacing: 0.12em;
        color: rgba(246, 244, 241, 0.42);
      }

      /* Keep opacity at 1: the window stays hidden until this splash paints
         (see tauri.conf visible:false + lib.rs on_page_load). Fading from 0
         made the first visible frame look like another black screen. */
      @keyframes boot-enter {
        from {
          opacity: 1;
          transform: translateY(8px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes boot-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.035); }
      }
      @keyframes boot-bloom {
        0%, 100% { opacity: 0.65; transform: scale(0.94); }
        50% { opacity: 1; transform: scale(1.06); }
      }
      @keyframes boot-sheen {
        to { transform: rotate(360deg); }
      }
      @keyframes boot-glint {
        0%, 55%, 100% { transform: translateX(-12%) rotate(18deg); opacity: 0; }
        70% { opacity: 0.9; }
        82% { transform: translateX(42%) rotate(18deg); opacity: 0; }
      }
      @keyframes boot-title-shimmer {
        0%, 100% { background-position: 100% 50%; }
        50% { background-position: 0% 50%; }
      }
      @keyframes boot-bar {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(280%); }
      }
      @keyframes boot-spark {
        0%, 100% { opacity: 0; transform: scale(0.4) translateY(4px); }
        35%, 55% { opacity: 0.95; transform: scale(1) translateY(0); }
        80% { opacity: 0; transform: scale(0.5) translateY(-6px); }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-splash,
        .boot-splash-stage,
        .boot-splash-bloom,
        .boot-splash-rays,
        .boot-splash-sheen,
        .boot-splash-halo,
        .boot-splash-arc,
        .boot-splash-mark-wrap,
        .boot-splash-mark-wrap::after,
        .boot-splash-sparks i,
        .boot-splash-title,
        .boot-splash-bar > span {
          animation: none !important;
          transition: opacity 160ms ease !important;
        }
        #boot-splash.is-leaving {
          transform: none;
          filter: none;
        }
        .boot-splash-bar > span {
          width: 100%;
          transform: none;
          opacity: 0.55;
        }
        .boot-splash-title {
          -webkit-text-fill-color: rgba(246, 244, 241, 0.88);
          background: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-splash-stage">
        <div class="boot-splash-hero">
          <div class="boot-splash-bloom"></div>
          <div class="boot-splash-rays"></div>
          <div class="boot-splash-sheen"></div>
          <div class="boot-splash-sparks" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i><i></i>
          </div>
          <div class="boot-splash-orbit">
            <div class="boot-splash-halo"></div>
            <div class="boot-splash-track"></div>
            <div class="boot-splash-arc"></div>
            <div class="boot-splash-arc is-secondary"></div>
            <div class="boot-splash-mark-wrap">
              <img class="boot-splash-mark" src="/favicon.png" alt="" width="60" height="60" />
            </div>
          </div>
        </div>
        <div class="boot-splash-copy">
          <div class="boot-splash-title">AI Workbench</div>
          <div class="boot-splash-bar"><span></span></div>
          <div class="boot-splash-hint">启动中</div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
