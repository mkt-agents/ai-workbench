<!doctype html>
<html lang="zh-CN" data-theme="glass">
<head>
<meta charset="utf-8" />
<title>模型配置扁平视图预览</title>
<link rel="stylesheet" href="site.css" />
<style>body { margin: 0; background: #14161a; }</style>
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-zap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m12 16 4-4-4-4"/><path d="M8 12h8"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
</svg>

<div class="ai-assistant">
  <div class="models-container">
    <div class="ai-model-list is-flat" id="list"></div>
  </div>
</div>

<template id="card">
  <div class="ai-model-item">
    <label class="ai-model-select"><input type="checkbox" /></label>
    <div class="ai-model-icon">MiMo</div>
    <div class="ai-model-info">
      <div class="ai-model-name">
        <span class="ai-model-name-text">mimo-v2.5</span>
        <span class="ai-model-state is-ok"><span class="ai-model-state-dot"></span>通过 · 3 天前</span>
      </div>
      <div class="ai-model-detail">
        <button type="button" class="ai-model-copyable"><span class="ai-model-copyable-text">mimo-v2.5</span><svg width="11" height="11"><use href="#i-copy"/></svg></button>
      </div>
      <div class="ai-model-meta">
        <button type="button" class="ai-model-copyable"><span class="ai-model-copyable-text">https://token-plan-cn.xiaomimimo.com/v1</span><svg width="11" height="11"><use href="#i-copy"/></svg></button>
        <span class="ai-model-meta-sep">·</span><span class="ai-model-meta-fixed">Key 已配置</span>
      </div>
    </div>
    <div class="ai-model-actions">
      <button class="btn btn-secondary btn-small"><svg width="12" height="12"><use href="#i-check"/></svg><span class="ai-action-label">设为默认</span></button>
      <button class="btn btn-secondary btn-small is-ok"><svg width="12" height="12"><use href="#i-zap"/></svg><span class="ai-action-label">测试</span></button>
      <button class="btn btn-secondary btn-small"><svg width="12" height="12"><use href="#i-arrow"/></svg><span class="ai-action-label">同步到 DSH</span></button>
      <button class="btn btn-secondary btn-small"><svg width="12" height="12"><use href="#i-copy"/></svg></button>
      <button class="btn btn-secondary btn-small"><svg width="12" height="12"><use href="#i-edit"/></svg><span class="ai-action-label">编辑</span></button>
      <button class="btn btn-danger btn-small"><svg width="12" height="12"><use href="#i-trash"/></svg></button>
    </div>
  </div>
</template>

<script>
  const names = [
    ["MiMo", "provider-mimo", "mimo-v2.5", "https://token-plan-cn.xiaomimimo.com/v1", "is-ok", "通过 · 3 天前"],
    ["Cat", "provider-longcat", "longcat-2.0", "https://api.longcat.chat/openai", "is-ok", "通过 · 3 天前"],
    ["...", "provider-custom", "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free", "https://api.tokenrouter.com/v1", "is-fail", "失败 · 3 天前"],
    ["Agnes", "provider-agnes", "agnes-2.5-flash", "https://api.agnes-ai.cn/v1", "is-ok", "通过 · 3 天前"],
    ["OR", "provider-openrouter", "openrouter/free", "https://openrouter.ai/api/v1", "is-ok", "通过 · 5 天前"],
    ["MiMo", "provider-mimo", "mimo-v2.5-fast", "https://token-plan-cn.xiaomimimo.com/v1", "is-untested", "未测试"],
  ];
  const tpl = document.getElementById("card");
  const list = document.getElementById("list");
  for (const [label, cls, model, url, state, verdict] of names) {
    const node = tpl.content.firstElementChild.cloneNode(true);
    node.querySelector(".ai-model-icon").className = "ai-model-icon " + cls;
    node.querySelector(".ai-model-icon").textContent = label;
    node.querySelector(".ai-model-name-text").textContent = model;
    node.querySelector(".ai-model-detail .ai-model-copyable-text").textContent = model;
    node.querySelector(".ai-model-meta .ai-model-copyable-text").textContent = url;
    const st = node.querySelector(".ai-model-state");
    st.className = "ai-model-state " + state;
    st.innerHTML = '<span class="ai-model-state-dot"></span>' + verdict;
    list.appendChild(node);
  }
</script>
</body>
</html>
